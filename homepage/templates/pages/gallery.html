{% extends 'base.html' %}
{% load static %}

{% block title %}Gallery — Mark{% endblock %}

{% block content %}
<section id="gallery" class="gallery-section">
    <div class="container">

        <!-- Section Header -->
        <div class="row justify-content-center mb-5 text-center">
            <div class="col-12 col-lg-8">
                <span class="section-label reveal-fade">— ᜎᜍᜏᜈ᜔ —</span>
                <h2 class="section-title reveal-fade">Gallery</h2>
                <p class="section-subtitle reveal-fade">
                    A curated collection of moments, designs, and visual stories.
                </p>
            </div>
        </div>

        <!-- Filter Buttons (will be wired later if needed) -->
        <div class="row justify-content-center mb-5">
            <div class="col-auto">
                <div class="btn-group gallery-filter reveal-fade" role="group" aria-label="Gallery filter">
                    <button type="button" class="btn btn-outline-custom active filter-btn" data-filter="all">All</button>
                    <button type="button" class="btn btn-outline-custom filter-btn" data-filter="design">Design</button>
                    <button type="button" class="btn btn-outline-custom filter-btn" data-filter="3D Models">3D Models</button>
                    <button type="button" class="btn btn-outline-custom filter-btn" data-filter="photography">photography</button>
                </div>
            </div>
        </div>

        <!-- Gallery Grid – skeleton placeholders -->
        <div class="row g-4" id="galleryGrid">
            <!-- Skeleton cards will be generated by JS initially -->
            <!-- 9 skeleton items -->
            {% for i in "123456789" %}
            <div class="col-12 col-sm-6 col-md-4 skeleton-card">
                <div class="gallery-item skeleton-item">
                    <div class="gallery-img skeleton-img"></div>
                    <div class="gallery-caption skeleton-caption">
                        <span class="skeleton-line w-50"></span>
                        <span class="skeleton-line w-75 mt-2"></span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Image Modal (lightbox) -->
        <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content border-0 bg-transparent">
                    <div class="modal-body p-0 text-center">
                        <img src="" id="modalImage" class="img-fluid shadow-lg" alt="Enlarged view" 
                            style="max-height: 90vh; border-radius: 12px;">
                        <button type="button" class="btn-close-custom position-absolute top-0 end-0 m-3" 
                                data-bs-dismiss="modal" aria-label="Close">
                            <i class="bi bi-x-lg text-white"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const grid = document.getElementById('galleryGrid');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const API_URL = '/api/gallery/';
        let allImages = [];
        let currentFilter = 'all';

        // Fetch images from DRF endpoint
        async function fetchGallery() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                allImages = data;
                renderGallery(currentFilter);
            } catch (error) {
                console.error('Failed to load gallery:', error);
                grid.innerHTML = '<p class="text-center text-muted w-100">Unable to load images. Please try again later.</p>';
            }
        }

        // Render images based on filter
        function renderGallery(filter) {
            const filtered = filter === 'all' ? allImages : allImages.filter(img => img.category === filter);
            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="text-center text-muted w-100">No images found for this category.</p>';
                return;
            }

            filtered.forEach(img => {
                const col = document.createElement('div');
                col.className = 'col-12 col-sm-6 col-md-4 reveal-fade';
                col.innerHTML = `
                    <figure class="gallery-item" data-full="${img.image}">
                        ${img.category ? `<span class="gallery-category-badge">${img.category}</span>` : ''}
                        <img src="${img.image}" alt="${img.title_jp || 'Gallery image'}" 
                            class="gallery-img" loading="lazy">
                        <figcaption class="gallery-caption">
                            <span class="caption-title">${img.title_jp || ''}</span>
                            <span class="caption-sub">${img.title_en || ''}</span>
                        </figcaption>
                    </figure>
                `;
                grid.appendChild(col);
            });

            // Attach click to open modal
            document.querySelectorAll('.gallery-item').forEach(item => {
                item.addEventListener('click', function (e) {
                    const fullUrl = this.dataset.full;
                    if (fullUrl) {
                        document.getElementById('modalImage').src = fullUrl;
                        const modal = new bootstrap.Modal(document.getElementById('imageModal'));
                        modal.show();
                    }
                });
            });

            // Trigger reveal animation
            document.querySelectorAll('.reveal-fade').forEach(el => el.classList.add('revealed'));
        }

        // Filter click handler
        filterButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                // Show skeleton while re-rendering? Optional – we simply re-render.
                renderGallery(currentFilter);
            });
        });

        // Initial load
        fetchGallery();
    });
</script>

<style>
    /* Skeleton loading styles */
    .skeleton-card {
        transition: opacity 0.3s;
    }
    .skeleton-img {
        height: 260px;
        background: linear-gradient(90deg, #f0ece7 25%, #e8e4df 50%, #f0ece7 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 16px 16px 0 0;
    }
    .skeleton-item .gallery-caption {
        position: static;
        padding: 20px 16px;
        background: var(--pure-white);
        transform: none;
        opacity: 1;
    }
    .skeleton-line {
        display: block;
        height: 12px;
        background: #e8e4df;
        border-radius: 6px;
        animation: shimmer 1.5s infinite;
    }
    .skeleton-line.w-50 { width: 50%; }
    .skeleton-line.w-75 { width: 75%; }
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }

    /* Force consistent size on gallery grid images */
    .gallery-item .gallery-img {
        width: 100%;
        height: 260px;            /* fixed height, same as skeleton */
        object-fit: cover;        /* crop to fill nicely */
        transition: transform 0.3s ease, filter 0.3s ease;
    }

    /* Close button style for modal */
    .btn-close-custom {
        background: none;
        border: none;
        font-size: 2rem;
        cursor: pointer;
        z-index: 1055;
        opacity: 0.9;
        transition: opacity 0.2s;
    }
    .btn-close-custom:hover {
        opacity: 1;
    }

    /* ── Gallery Item (enhanced) ── */
.gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    background: var(--pure-white);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
    border: 1px solid var(--border-light);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
}

/* Washi‑style inner dashed border (appears on hover) */
.gallery-item::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px dashed var(--sakura-pink);
    border-radius: 15px;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    z-index: 2;
}
.gallery-item:hover::after {
    opacity: 0.5;
}

.gallery-item:hover {
    transform: translateY(-8px);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
    border-color: transparent;
}

/* Image */
.gallery-img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease, filter 0.4s ease;
    border-radius: 20px 20px 0 0;
}
.gallery-item:hover .gallery-img {
    transform: scale(1.06);
    filter: brightness(0.95);
}

/* Magnifier icon (appears on hover) */
.gallery-item::before {
    content: '\F4C2';         /* Bootstrap icon code for zoom-in (bi-zoom-in) */
    font-family: 'bootstrap-icons';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    font-size: 2.4rem;
    color: #ffffff;
    background: rgba(44, 62, 107, 0.7); /* indigo overlay */
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 3;
    pointer-events: none;
    line-height: 1;
}
.gallery-item:hover::before {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

/* Caption overlay (enhanced) */
.gallery-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 24px 20px 20px;
    background: linear-gradient(to top, rgba(255,255,255,0.9), rgba(255,255,255,0) 100%);
    backdrop-filter: blur(2px);
    transform: translateY(10px);
    opacity: 0;
    transition: all 0.35s ease;
    border-radius: 0 0 20px 20px;
}
.gallery-item:hover .gallery-caption {
    transform: translateY(0);
    opacity: 1;
}

.caption-title {
    display: block;
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 1.2rem;
    color: var(--ink-black);
    letter-spacing: 0.05em;
    margin-bottom: 2px;
}
.caption-sub {
    display: block;
    font-family: var(--font-sans);
    font-weight: 300;
    font-size: 0.8rem;
    color: var(--text-gray);
    opacity: 0.85;
}

/* Optional category badge (if category exists) */
.gallery-category-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    padding: 4px 14px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(4px);
    border-radius: 40px;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    color: var(--indigo);
    z-index: 2;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.gallery-item:hover .gallery-category-badge {
    opacity: 1;
}

/* Skeleton remains unaffected */
.skeleton-item::before,
.skeleton-item::after {
    display: none;            /* no icons on skeleton */
}
    /* Override gallery-caption for real images (from previous CSS) remains unchanged */
</style>
{% endblock %}

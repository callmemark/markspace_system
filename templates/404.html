<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: #fafaf7;
            color: #1c1c1c;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 320px;
            height: 320px;
            border: 2px solid #e8b4b8;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.12;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
        }
        h1 {
            font-size: 6rem;
            font-weight: 700;
            color: #2c3e6b;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .japanese {
            font-size: 1.8rem;
            color: #8c8c8c;
            margin-bottom: 0.5rem;
        }
        .message {
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
            font-weight: 300;
            font-size: 1.1rem;
            color: #5a5a5a;
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: #2c3e6b;
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            border: none;
        }
        .btn:hover {
            background-color: #4a6094;
            transform: translateY(-2px);
        }
        .divider {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #c44545;
            transform: rotate(45deg);
            margin: 1.5rem 0;
            opacity: 0.7;
        }
        @media (max-width: 480px) {
            h1 { font-size: 4rem; }
            .japanese { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p class="japanese">ᜏᜎᜅ᜔ ᜎᜋᜈ᜔</p>
        <div class="divider"></div>
        <p class="message">
            The page you’re looking for has drifted away<br>
            like cherry blossoms in the wind.
        </p>
        <a href="/" class="btn">← Return Home</a>
    </div>
</body>
</html>
